# Конфиг агента локального бэкапа — копия в /etc/coop-backup/coop_backup.ini,
# владелец root:coop-backup, права 0640.

[server]
# Сервер сайта (как в ssh). Ключ агента (ssh-keygen -t ed25519, см. README)
# и known_hosts с ключом сервера — общие для всех кооперативов ниже.
host = coop.example.ru
port = 22
identity_file = /etc/coop-backup/id_ed25519
known_hosts = /etc/coop-backup/known_hosts

[local]
# Зеркала последнего состояния серверов (перезаписываются каждый проход):
# у каждого кооператива — mirror_dir/ИМЯ/
mirror_dir = /var/lib/coop-backup/mirror
# restic-репозиторий с историей, общий для всех кооперативов. Лучше на
# другом диске, чем система.
repository = /var/lib/coop-backup/restic
# Пароль репозитория — одна строка. Сохраните его ещё где-то (менеджер
# паролей, бумага в сейфе): без него репозиторий не расшифровать.
password_file = /etc/coop-backup/restic-password
state_dir = /var/lib/coop-backup
# Сколько снимков хранить (у каждого кооператива)
keep_daily = 14
keep_weekly = 8
keep_monthly = 12
keep_yearly = 5
# Снимок БД на сервере старше стольких часов — предупреждение
max_age_hours = 36

# Кооперативы — по секции на каждый, [coop:ИМЯ]. ИМЯ — латиница в нижнем
# регистре, цифры и «-»; это имя каталога зеркала и, если не задан
# snapshot_host, --host снимков в restic.
#   user          — пользователь сайта на сервере (по умолчанию ИМЯ);
#                   в его authorized_keys — ключ агента с backup_pull_gate.sh
#   host, port    — если кооператив на другом сервере, чем [server]
#   snapshot_host — --host снимков restic (rs snapshots --host …)
[coop:coop]
user = coop
snapshot_host = coop-server

[coop:coop2]
user = coop2

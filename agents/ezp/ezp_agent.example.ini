# Конфиг агента ЭЗП — копия в /etc/ezp-agent/ezp_agent.ini,
# владелец root:ezp-agent, права 0640 (здесь токены и ПИН Рутокена).

[site]
# Адрес сайта кооператива (без / в конце)
url = https://coop.example.ru
# Токен агента: сайт → Заказные письма → Настройки API Почты → «Выпустить токен агента»
agent_token =

[ezp]
# ID и токен отправителя, выданные Почтой (ezp.support-r00@russianpost.ru).
# Для интеграционного теста и для продуктива — разные пары.
id =
token =
# Локальный вход stunnel (accept в stunnel.conf). Протокол — http:
# шифрует сам stunnel.
url = http://127.0.0.1:3080

[crypto]
cryptcp = /opt/cprocsp/bin/amd64/cryptcp
# SHA1-отпечаток сертификата КЭП (certmgr -list, строка SHA1 Thumbprint)
thumbprint = 32c441ef7c63a951ab66b4ef585bfe05fe6fdbd7
# ПИН Рутокена — без него cryptcp спросил бы его в консоли, а у демона её нет
pin =
# Доп. ключи cryptcp -signf. По умолчанию -errchain: цепочка до корня ФНС не
# построилась — ошибка, а не вопрос в консоли. Если нет доступа к CRL/OCSP
# ФНС — можно «-errchain -norev» (без проверки отзыва).
sign_extra_args = -errchain

[agent]
# Как часто ходить на сайт за письмами и статусами, секунд
poll_interval = 300
# Журнал отправленных писем (защита от повторной отправки) — StateDirectory юнита
state_dir = /var/lib/ezp-agent
# RuntimeDirectory юнита
lock_file = /run/ezp-agent/ezp_agent.lock

{% extends "base.html" %}
{% block title %}{{ _("Новый пароль") }}{% endblock %}
{% block content %}
{% include "auth/_anon_toolbar.html" %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card bg-body">
      <div class="card-body">
        <h5 class="card-title mb-3">{{ _("Новый пароль") }}</h5>
        <p class="text-muted">{{ _("Введите код из письма/СМС и новый пароль.") }}</p>
        <form method="post">
          <input type="hidden" name="target" value="{{ target }}">
          <div class="mb-3">
            <label class="form-label">{{ _("Код") }}</label>
            <input class="form-control" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _("Новый пароль") }}</label>
            <input class="form-control" type="password" name="new_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _("Повторите новый пароль") }}</label>
            <input class="form-control" type="password" name="confirm_password" required>
          </div>
          <button class="btn btn-primary w-100">{{ _("Сохранить пароль") }}</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('auth.forgot_password') }}" class="small">{{ _("Запросить код заново") }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

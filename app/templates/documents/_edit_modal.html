{# Переменные из цикла: d (документ), d.id (id документа) #}
<div class="modal fade" id="editDocumentModal{{ d.id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form method="post" action="{{ url_for('documents.edit', doc_id=d.id) }}" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">{{ _("Редактирование документа") }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          {% include "documents/_fields.html" %}
        </div>
        <div class="modal-footer d-flex justify-content-end">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _("Отмена") }}</button>
          <button class="btn btn-primary">{{ _("Сохранить") }}</button>
        </div>
      </form>
    </div>
  </div>
</div>

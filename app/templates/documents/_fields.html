{# Ожидает переменную doc_types. Только поля, без <form> и кнопок. #}
<div class="mb-3">
  <label class="form-label">{{ _("Тип документа") }}</label>
  <select class="form-select" name="doc_type" required>
    {% for dt in doc_types %}<option value="{{ dt.value }}">{{ doc_type_label(dt.value) }}</option>{% endfor %}
  </select>
</div>
<div class="mb-3">
  <label class="form-label">{{ _("Номер") }}</label>
  <input class="form-control" name="number">
</div>
<div class="mb-3">
  <label class="form-label">{{ _("Дата") }}</label>
  <input class="form-control" type="date" name="date" required>
</div>
<div class="mb-3">
  <label class="form-label">{{ _("Название") }}</label>
  <input class="form-control" name="title" required>
</div>
<div class="mb-3">
  <label class="form-label">{{ _("Файл") }}</label>
  <input class="form-control" type="file" name="file">
</div>
<div class="mb-3">
  <label class="form-label">{{ _("Комментарий") }}</label>
  <textarea class="form-control" name="comment"></textarea>
</div>

{% extends "base.html" %}
{% block title %}{{ _("Новый документ") if not doc else _("Редактирование документа") }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ _("Новый документ") if not doc else _("Редактирование документа") }}</h3>
<form method="post" enctype="multipart/form-data" class="bg-body p-4 rounded border" style="max-width:600px">
  {% include "documents/_fields.html" %}
  <div class="d-flex justify-content-end gap-2">
    <button class="btn btn-primary">{{ _("Сохранить") }}</button>
    <a class="btn btn-secondary" href="{{ url_for('documents.list_documents') }}">{{ _("Отмена") }}</a>
  </div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
  <div class="card bg-body mt-5" style="max-width:520px">
    <div class="card-body text-center py-5">
      <div class="display-6 mb-3">{{ code }}</div>
      <h5 class="card-title">{{ title }}</h5>
      <p class="card-text text-muted">{{ message }}</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">{{ _("На главную") }}</a>
    </div>
  </div>
</div>
{% endblock %}

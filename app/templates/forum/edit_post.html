{% extends "base.html" %}
{% block title %}{{ _("Изменить сообщение") }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ _("Изменить сообщение") }}</h3>
<form method="post" class="bg-body p-4 rounded border">
  {% if is_first %}
  <div class="mb-3">
    <label class="form-label">{{ _("Заголовок темы") }}</label>
    <input class="form-control" name="title" value="{{ post.topic.title }}" required maxlength="255" autofocus>
  </div>
  {% endif %}

  <div class="mb-3">
    <label class="form-label">{{ _("Текст сообщения") }}</label>
    {% set textarea_value = post.body %}
    {% include "forum/_editor.html" %}
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button class="btn btn-primary">{{ _("Сохранить") }}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('forum.view', topic_id=post.topic_id) }}">{{ _("Отмена") }}</a>
  </div>
</form>
{% endblock %}

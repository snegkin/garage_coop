{% extends "base.html" %}
{% block title %}{{ _("Человек") }}{% endblock %}
{% block content %}
<h3 class="mb-3">{{ _("Редактирование") if person else _("Новый человек") }}</h3>
<form method="post" class="bg-body p-4 rounded border" style="max-width:700px">
  {% include "persons/_fields.html" %}
  <div class="d-flex justify-content-end gap-2 mt-3">
    <button class="btn btn-primary">{{ _("Сохранить") }}</button>
    <a class="btn btn-secondary" href="{{ url_for('persons.list_persons') }}">{{ _("Отмена") }}</a>
  </div>
</form>
{% endblock %}

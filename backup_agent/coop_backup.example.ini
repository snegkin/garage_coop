# Конфиг агента локального бэкапа — копия в /etc/coop-backup/coop_backup.ini,
# владелец root:coop-backup, права 0640.

[server]
# Сервер сайта (как в ssh) и пользователь, под которым работает сайт
host = coop.example.ru
port = 22
user = coop
# Ключ агента (ssh-keygen -t ed25519, см. README) и known_hosts с ключом сервера
identity_file = /etc/coop-backup/id_ed25519
known_hosts = /etc/coop-backup/known_hosts

[local]
# Зеркало последнего состояния сервера (перезаписывается каждый проход)
mirror_dir = /var/lib/coop-backup/mirror
# restic-репозиторий с историей. Лучше на другом диске, чем система.
repository = /var/lib/coop-backup/restic
# Пароль репозитория — одна строка. Сохраните его ещё где-то (менеджер
# паролей, бумага в сейфе): без него репозиторий не расшифровать.
password_file = /etc/coop-backup/restic-password
state_dir = /var/lib/coop-backup
# Сколько снимков хранить
keep_daily = 14
keep_weekly = 8
keep_monthly = 12
keep_yearly = 5
# Снимок БД на сервере старше стольких часов — предупреждение
max_age_hours = 36

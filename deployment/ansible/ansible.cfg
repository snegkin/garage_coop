[defaults]
# Инвентарь и секреты — вне репозитория, рядом с конфигом deploy.sh
# (см. README.md). Другой инвентарь — ansible-playbook -i ПУТЬ.
inventory = ~/.config/garage-coop/inventory.ini
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True

# Значения по умолчанию. Переопределяются в ~/.config/garage-coop/vars.yml
# (образец — vars.example.yml); сюда секреты не писать.

timezone: Europe/Moscow            # времена в crontab ниже — по нему
swap_size_mb: 1024                 # 0 — не создавать /swapfile
ssh_port: 22
install_ffmpeg: "{{ 'dvr_snapshot' in cron_enable }}"  # кадры с камер: ставится сам, если включён dvr_snapshot
install_fail2ban: true

app_repo_url: git@github.com:snegkin/garage_coop.git
app_branch: master
app_user: coop
app_dir: "/home/{{ app_user }}/garage_coop"
app_instance_dir: "{{ app_dir }}/instance"
service_name: garage-coop
app_port: 8000
gunicorn_args: "-w 1 --threads 4 -k gthread"

coop_domain: ""                    # пусто — без HTTPS, сайт по IP
certbot_email: ""

# Публичные ключи, с которыми можно войти под app_user (для deploy.sh).
deploy_ssh_pubkeys: []

# Ключи агента локального бэкапа (backup_agent/ на компьютере председателя):
# входят под app_user, но только в scripts/backup_pull_gate.sh — rsync на
# чтение внутри instance/, ни shell, ни проброса портов.
backup_agent_pubkeys: []

# Куда на ЭТОМ компьютере записать конфиг deploy.sh (если файла ещё нет).
# Рядом со скриптом (в .gitignore) — "{{ playbook_dir }}/../deploy-from-git/deploy.conf";
# deploy.sh сам ищет и там, и здесь.
deploy_conf_path: "{{ lookup('env', 'HOME') }}/.config/garage-coop/deploy.conf"

# .env приложения
app_secret_key: ""
app_bank_api_encryption_key: ""
recaptcha_site_key: ""
recaptcha_secret_key: ""
# Токен Яндекс.Диска для rclone (вывод `rclone authorize "yandex"`, JSON) —
# с ним плейбук создаст remote yadisk; в app_env_extra тогда
# RESTIC_REPOSITORY: rclone:yadisk:coop-backup (см. vars.example.yml).
rclone_yandex_token: ""
app_env_extra: {}                  # любые другие переменные .env: {ИМЯ: значение}

# Перенос данных со своего компьютера. Делается ОДИН раз: если БД на
# сервере уже есть, она не трогается (restore_force: true — перезаписать,
# прежняя сохраняется в instance/backups/pre_restore_*.db).
restore_db_file: ""                # локальный coop.db; пусто — новая БД через seed.py
restore_source_instance_dir: ""    # локальный instance/, откуда брать каталоги ниже
restore_instance_dirs: [uploads, bank_certs, dvr, bundles]
restore_force: false

# cron пользователя app_user (docs/deployment.md, «Автоматизация»).
# Раз в минуту каждый скрипт поднимает приложение (~120 МБ) — включайте
# частые только для реально настроенных интеграций.
cron_jobs:
  - {name: update_key_rate,            minute: "0",   hour: "6"}
  - {name: accrue_penalty,             minute: "10",  hour: "6", day: "1"}
  - {name: reconcile_sms_charges,      minute: "30",  hour: "3"}
  - {name: sync_bank_accounts,         minute: "0",   hour: "7", weekday: "1-5"}
  - {name: sync_counterparty_balances, minute: "10",  hour: "7"}
  - {name: backup_mailbox,             minute: "50",  hour: "2"}
  - {name: backup_db,                  minute: "0",   hour: "3"}
  - {name: backup_offsite,             minute: "20",  hour: "3"}
  - {name: cleanup_orphan_attachments, minute: "40",  hour: "3"}
  - {name: board_chat_digest,          minute: "*/5"}
  - {name: poll_mailbox,               minute: "*/5"}
  - {name: poll_telegram,              minute: "*",   enabled: false}
  - {name: poll_ewelink,               minute: "*",   enabled: false}
  - {name: dvr_snapshot,               minute: "*",   enabled: false}

# Включить/выключить задачи из списка выше по имени, не копируя его целиком:
#   cron_enable: [dvr_snapshot, poll_telegram]
#   cron_disable: [poll_mailbox]
cron_enable: []
cron_disable: []

# --- Агенты на ЭТОМ компьютере (компьютер председателя) -------------------
# Второй play в site.yml, тег local: ./run.sh --tags local. Нужен sudo на
# этом компьютере — run.sh сам добавляет -K (--ask-become-pass).

# Агент локального бэкапа (backup_agent/README.md). Ключ агента сам
# попадает в authorized_keys сервера, known_hosts — ключ из
# /etc/ssh/ssh_host_ed25519_key.pub сервера (без ssh-keyscan).
local_backup_agent: false
local_backup_repository: /var/lib/coop-backup/restic
# Точка монтирования диска с репозиторием: если не смонтирован — стоп,
# иначе restic создал бы новый пустой репозиторий на системном диске.
local_backup_mount: ""
local_backup_keep_daily: 14
local_backup_keep_weekly: 8
local_backup_keep_monthly: 12
local_backup_keep_yearly: 5
local_backup_max_age_hours: 36

# Агент ЭЗП (ezp_agent/README.md). Сертификат с Рутокена ставится в
# хранилище ezp-agent, если токен вставлен; службы запускаются, только
# когда заполнены все ezp_* ниже и сертификат с ключом на месте.
local_ezp_agent: false
ezp_cryptopro_dir: "{{ playbook_dir }}/../../ezp_agent/cryptopro"   # .deb КриптоПро, см. README там
ezp_cryptopro_packages:
  - lsb-cprocsp-base
  - lsb-cprocsp-rdr-64
  - lsb-cprocsp-kc1-64
  - lsb-cprocsp-capilite-64
  - cprocsp-curl-64
  - lsb-cprocsp-ca-certs
  - cprocsp-rdr-pcsc-64
  - cprocsp-rdr-rutoken-64
  - cprocsp-stunnel-64
  - ifd-rutokens
ezp_cert_dir: "{{ playbook_dir }}/../../ezp_agent/certs"
ezp_root_certs: [Mincifry_Rossii_root_guc2022.cer]   # → хранилище mRoot компьютера
ezp_ca_certs: [CA_FNS_Russia_2025_01.crt]            # → mCA
ezp_client_cert: ""          # открытая часть КЭП в ezp_cert_dir, например gm-voshod.cer
ezp_container: ""            # контейнер на токене; пусто — единственный найденный
ezp_site_url: "{{ ('https://' + coop_domain) if coop_domain else '' }}"
ezp_agent_token: ""          # сайт → Заказные письма → Настройки API Почты → «Выпустить токен агента»
ezp_id: ""                   # ID и токен отправителя от Почты
ezp_token: ""
ezp_pin: ""                  # ПИН Рутокена
ezp_production: false        # false — интеграционный контур Почты
ezp_poll_interval: 300
ezp_sign_extra_args: "-errchain"

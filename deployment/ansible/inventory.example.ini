# Копия — в ~/.config/garage-coop/inventory.ini (вне git).
#
# Первый прогон на свежем VPS — под root (так его обычно и выдают): с
# root synchronize заливает instance/uploads без возни с sudo. Вход по
# паролю — ansible_password (нужен sshpass) или ключ: ssh-copy-id root@IP.
[coop]
coop-vps ansible_host=203.0.113.10 ansible_user=root
# ansible_port=22
# ansible_password=...   # лучше ключ; пароль — только в этом файле, chmod 600

# Сервер сайта кооператива с нуля: Ubuntu 24.04 / Debian 13 (Python ≥ 3.12),
# gunicorn за nginx с HTTPS, перенос БД и файлов со своего компьютера.
# Основной кооператив + необязательные дополнительные на том же сервере с
# общим кодом (coop_extra_instances в defaults.yml). Повторный прогон безопасен: БД и файлы на сервере не
# перезаписываются (кроме restore_force: true), остальное приводится к
# описанному состоянию. Запуск и порядок переезда — README.md.
#
#   cd deployment/ansible && ansible-playbook site.yml
#   ansible-playbook site.yml --tags app         # только код/.env/сервис
#   ansible-playbook site.yml --check --diff     # что изменится
#   ansible-playbook site.yml --tags local -K    # только агенты на этом компьютере
#   ansible-playbook site.yml --tags instances   # только дополнительные кооперативы

- name: Сервер сайта кооператива
  hosts: coop
  become: true
  # Упал прогон после смены конфига nginx/сервиса — перезагрузить их всё
  # равно: при следующем прогоне файл уже не изменится и notify не будет.
  force_handlers: true
  vars_files:
    - defaults.yml
    - "{{ lookup('env', 'COOP_VARS') or lookup('env', 'HOME') + '/.config/garage-coop/vars.yml' }}"

  pre_tasks:
    - name: Обязательные настройки заданы
      ansible.builtin.assert:
        that:
          - app_secret_key | length >= 32
          - app_bank_api_encryption_key | length > 0
          - coop_domain | length == 0 or certbot_email | length > 0
          - coop_domain is match('^[A-Za-z0-9.-]*$')
          - coop_domain_aliases | length == 0 or coop_domain | length > 0
          - coop_domain_aliases | reject('match', '^[A-Za-z0-9.-]+$') | list | length == 0
          - coop_domain not in coop_domain_aliases
          - coop_domain_aliases | unique | length == coop_domain_aliases | length
          - certbot_email | default('') is match('^[!-~]*$')
        fail_msg: >-
          В vars.yml нужны app_secret_key (≥32 символов) и
          app_bank_api_encryption_key — те же, что на старом сервере; при
          coop_domain — ещё certbot_email; coop_domain_aliases — только вместе
          с coop_domain, без повторов и без него самого. Кириллический домен (и в почте
          тоже) — в punycode: python3 -c "print('пример.рф'.encode('idna').decode())".
      tags: always

    - name: Локальная БД для переноса существует
      ansible.builtin.stat:
        path: "{{ restore_db_file }}"
      delegate_to: localhost
      become: false
      register: local_db
      when: restore_db_file | length > 0
      failed_when: not local_db.stat.exists
      tags: always

    # Здесь, а не в tasks/nginx.yml: от этого зависит и .env (FORCE_HTTPS),
    # а он генерируется и при --tags app.
    - name: Есть ли сертификат
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ coop_domain }}/fullchain.pem"
      register: cert
      when: coop_domain | length > 0
      tags: always

    - name: HTTPS включается, только если сертификат уже есть
      ansible.builtin.set_fact:
        https_enabled: "{{ coop_domain | length > 0 and cert.stat.exists | default(false) }}"
      tags: always

    # Проверка и вычисляемые поля (пользователь, служба, пути) —
    # filter_plugins/coop.py. Нужен и шаблону deploy.conf, и cron/sudoers.
    - name: Дополнительные кооперативы
      ansible.builtin.set_fact:
        extra_instances: >-
          {{ coop_extra_instances | coop_instances({'app_user': app_user, 'app_port': app_port,
             'coop_domain': coop_domain, 'coop_domain_aliases': coop_domain_aliases,
             'app_secret_key': app_secret_key,
             'service_name': service_name, 'cron_jobs': cron_jobs}) }}
      tags: always

    - name: Для сертификатов дополнительных кооперативов нужен certbot_email
      ansible.builtin.assert:
        that: certbot_email | length > 0
        fail_msg: "coop_extra_instances: задайте certbot_email"
        quiet: true
      when: extra_instances | length > 0
      tags: always

  tasks:
    - name: Система
      ansible.builtin.import_tasks: tasks/system.yml
      tags: system

    - name: Код и окружение
      ansible.builtin.import_tasks: tasks/code.yml
      tags: app

    - name: Перенос БД и файлов
      ansible.builtin.import_tasks: tasks/restore.yml
      tags: restore

    - name: nginx и HTTPS
      ansible.builtin.import_tasks: tasks/nginx.yml
      tags: nginx

    - name: .env, служба, cron
      ansible.builtin.import_tasks: tasks/service.yml
      tags: app

    - name: Каталог конфига deploy.sh на этом компьютере
      ansible.builtin.file:
        path: "{{ deploy_conf_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      tags: app

    - name: Конфиг deploy.sh на этом компьютере
      ansible.builtin.template:
        src: deploy.conf.j2
        dest: "{{ deploy_conf_path }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
      tags: app

    # deploy.conf создаётся один раз (force: false) — добавленный позже
    # кооператив сам в него не попадёт.
    - name: deploy.conf знает все кооперативы
      ansible.builtin.debug:
        msg:
          - "В {{ deploy_conf_path }} нет служб: {{ missing | join(', ') }} — deploy.sh их не перезапустит."
          - "Удалите файл и прогоните --tags app (создастся заново) или впишите сами:"
          - "{{ lookup('ansible.builtin.template', 'deploy.conf.j2') | regex_findall('(?m)^(?:SERVICES|HEALTH_URLS|BACKUP_ENV_FILES)=.*$') | join('  ') }}"
      vars:
        conf_text: "{{ lookup('ansible.builtin.file', deploy_conf_path, errors='ignore') | default('', true) }}"
        services_line: "{{ conf_text | regex_search('(?m)^SERVICES=.*$') | default('', true) }}"
        missing: "{{ ([service_name] + extra_instances | map(attribute='service') | list)
                     | reject('in', services_line | regex_replace('^SERVICES=', '') | replace('\"', '') | split) | list }}"
      when: extra_instances | length > 0 and missing | length > 0
      tags: app

    # Код и venv — общие, из app_dir основного; поэтому app_dir и
    # app_instance_dir переопределяются явно (иначе app_dir пересчитался бы
    # от app_user = name). Переменные include перекрывают и vars.yml, и
    # set_fact; handlers основного здесь не используются.
    - name: Общие пути для дополнительных кооперативов
      ansible.builtin.set_fact:
        shared_app_dir: "{{ app_dir }}"
        shared_instance_dir: "{{ app_instance_dir }}"
        primary_app_user: "{{ app_user }}"
      when: extra_instances | length > 0
      tags: [instances, app]

    - name: Дополнительные кооперативы
      ansible.builtin.include_tasks:
        file: tasks/instance.yml
        apply:
          tags: [instances, app]
      loop: "{{ extra_instances }}"
      loop_control:
        loop_var: inst
        label: "{{ inst.name }} ({{ inst.domain }})"
      vars:
        app_user: "{{ inst.user }}"
        app_dir: "{{ shared_app_dir }}"
        app_instance_dir: "{{ inst.instance_dir }}"
        app_env_file: "{{ inst.env_file }}"
        service_name: "{{ inst.service }}"
        app_port: "{{ inst.port }}"
        coop_domain: "{{ inst.domain }}"
        coop_domain_aliases: "{{ inst.aliases }}"
        app_secret_key: "{{ inst.secret_key }}"
        app_bank_api_encryption_key: "{{ inst.bank_api_encryption_key }}"
        recaptcha_site_key: "{{ inst.recaptcha_site_key }}"
        recaptcha_secret_key: "{{ inst.recaptcha_secret_key }}"
        app_env_extra: "{{ inst.env_extra }}"
        rclone_yandex_token: "{{ inst.rclone_yandex_token }}"
        restore_db_file: "{{ inst.restore_db_file }}"
        restore_source_instance_dir: "{{ inst.restore_source_instance_dir }}"
        nginx_default_server: false
      tags: [instances, app]

  handlers:
    - name: reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: restart app
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true

# Агенты на ЭТОМ компьютере (компьютер председателя): локальный бэкап и ЭЗП.
# Включаются local_backup_agent / local_ezp_agent в vars.yml. Нужен sudo
# здесь — ключ -K (setup.sh сам спрашивает пароль).
- name: Агенты на этом компьютере
  hosts: localhost
  # Без connection: local — неявный localhost и так локальный, а ключевое
  # слово play перебило бы соединение и у задач с delegate_to: сервер
  # (authorized_key, ключ ssh сервера, backup_offsite выполнились бы здесь).
  gather_facts: false
  become: true
  vars_files:
    - defaults.yml
    - "{{ lookup('env', 'COOP_VARS') or lookup('env', 'HOME') + '/.config/garage-coop/vars.yml' }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
    repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
    coop_server: "{{ groups['coop'] | first }}"
    local_backup_server_host: "{{ coop_domain or hostvars[coop_server].ansible_host | default(coop_server) }}"

  tasks:
    - name: Агент локального бэкапа
      ansible.builtin.include_tasks:
        file: tasks/local_backup_agent.yml
        apply:
          tags: local
      when: local_backup_agent | bool
      tags: local

    - name: Агент ЭЗП
      ansible.builtin.include_tasks:
        file: tasks/local_ezp_agent.yml
        apply:
          tags: local
      when: local_ezp_agent | bool
      tags: local

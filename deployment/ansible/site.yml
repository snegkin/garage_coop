# Сервер сайта кооператива с нуля: Ubuntu 24.04 / Debian 13 (Python ≥ 3.12), один
# кооператив, gunicorn за nginx с HTTPS, перенос БД и файлов со своего
# компьютера. Повторный прогон безопасен: БД и файлы на сервере не
# перезаписываются (кроме restore_force: true), остальное приводится к
# описанному состоянию. Запуск и порядок переезда — README.md.
#
#   cd deployment/ansible && ansible-playbook site.yml
#   ansible-playbook site.yml --tags app         # только код/.env/сервис
#   ansible-playbook site.yml --check --diff     # что изменится
#   ansible-playbook site.yml --tags local -K    # только агенты на этом компьютере

- name: Сервер сайта кооператива
  hosts: coop
  become: true
  # Упал прогон после смены конфига nginx/сервиса — перезагрузить их всё
  # равно: при следующем прогоне файл уже не изменится и notify не будет.
  force_handlers: true
  vars_files:
    - defaults.yml
    - "{{ lookup('env', 'COOP_VARS') or lookup('env', 'HOME') + '/.config/garage-coop/vars.yml' }}"

  pre_tasks:
    - name: Обязательные настройки заданы
      ansible.builtin.assert:
        that:
          - app_secret_key | length >= 32
          - app_bank_api_encryption_key | length > 0
          - coop_domain | length == 0 or certbot_email | length > 0
          - coop_domain is match('^[A-Za-z0-9.-]*$')
          - certbot_email | default('') is match('^[!-~]*$')
        fail_msg: >-
          В vars.yml нужны app_secret_key (≥32 символов) и
          app_bank_api_encryption_key — те же, что на старом сервере; при
          coop_domain — ещё certbot_email. Кириллический домен (и в почте
          тоже) — в punycode: python3 -c "print('пример.рф'.encode('idna').decode())".
      tags: always

    - name: Локальная БД для переноса существует
      ansible.builtin.stat:
        path: "{{ restore_db_file }}"
      delegate_to: localhost
      become: false
      register: local_db
      when: restore_db_file | length > 0
      failed_when: not local_db.stat.exists
      tags: always

    # Здесь, а не в tasks/nginx.yml: от этого зависит и .env (FORCE_HTTPS),
    # а он генерируется и при --tags app.
    - name: Есть ли сертификат
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ coop_domain }}/fullchain.pem"
      register: cert
      when: coop_domain | length > 0
      tags: always

    - name: HTTPS включается, только если сертификат уже есть
      ansible.builtin.set_fact:
        https_enabled: "{{ coop_domain | length > 0 and cert.stat.exists | default(false) }}"
      tags: always

  tasks:
    - name: Система
      ansible.builtin.import_tasks: tasks/system.yml
      tags: system

    - name: Код и окружение
      ansible.builtin.import_tasks: tasks/code.yml
      tags: app

    - name: Перенос БД и файлов
      ansible.builtin.import_tasks: tasks/restore.yml
      tags: restore

    - name: nginx и HTTPS
      ansible.builtin.import_tasks: tasks/nginx.yml
      tags: nginx

    - name: .env, служба, cron
      ansible.builtin.import_tasks: tasks/service.yml
      tags: app

    - name: Каталог конфига deploy.sh на этом компьютере
      ansible.builtin.file:
        path: "{{ deploy_conf_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      tags: app

    - name: Конфиг deploy.sh на этом компьютере
      ansible.builtin.template:
        src: deploy.conf.j2
        dest: "{{ deploy_conf_path }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
      tags: app

  handlers:
    - name: reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: restart app
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true

# Агенты на ЭТОМ компьютере (компьютер председателя): локальный бэкап и ЭЗП.
# Включаются local_backup_agent / local_ezp_agent в vars.yml. Нужен sudo
# здесь — ключ -K (run.sh сам спрашивает пароль).
- name: Агенты на этом компьютере
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars_files:
    - defaults.yml
    - "{{ lookup('env', 'COOP_VARS') or lookup('env', 'HOME') + '/.config/garage-coop/vars.yml' }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
    repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
    coop_server: "{{ groups['coop'] | first }}"
    local_backup_server_host: "{{ coop_domain or hostvars[coop_server].ansible_host | default(coop_server) }}"

  tasks:
    - name: Агент локального бэкапа
      ansible.builtin.include_tasks:
        file: tasks/local_backup_agent.yml
        apply:
          tags: local
      when: local_backup_agent | bool
      tags: local

    - name: Агент ЭЗП
      ansible.builtin.include_tasks:
        file: tasks/local_ezp_agent.yml
        apply:
          tags: local
      when: local_ezp_agent | bool
      tags: local

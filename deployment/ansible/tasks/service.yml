- name: .env приложения
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  notify: restart app

# Яндекс.Диск для внешнего бэкапа (restic → rclone, docs/deployment.md,
# «Внешний бэкап»). force: false — rclone сам продлевает токен и пишет
# новый в этот файл; перезаписывать его старым из vars.yml нельзя.
# Заменить токен: удалить файл на сервере и прогнать плейбук.
- name: Каталог конфига rclone
  ansible.builtin.file:
    path: "/home/{{ app_user }}/.config/rclone"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0700"
  when: rclone_yandex_token | length > 0

- name: rclone.conf — remote yadisk
  ansible.builtin.copy:
    dest: "/home/{{ app_user }}/.config/rclone/rclone.conf"
    content: |
      [yadisk]
      type = yandex
      token = {{ rclone_yandex_token if rclone_yandex_token is string else (rclone_yandex_token | to_json) }}
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
    force: false
  when: rclone_yandex_token | length > 0

- name: БД есть
  ansible.builtin.stat:
    path: "{{ app_instance_dir }}/coop.db"
  register: db_now

- name: БД нет и переносить нечего — новая (chairman / change-me-please)
  ansible.builtin.shell: set -a && . ./.env && set +a && venv/bin/python seed.py
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: not db_now.stat.exists

- name: Служба systemd
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0644"
  notify: restart app

- name: Служба включена и запущена
  ansible.builtin.systemd_service:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Перезапуск, если менялись .env/юнит
  ansible.builtin.meta: flush_handlers

- name: Сайт отвечает (миграции накатываются при старте)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
    follow_redirects: none
    status_code: [200, 301, 302, 303, 307, 308, 401, 403, 404]
  register: health
  retries: 30
  delay: 3
  until: health.status in [200, 301, 302, 303, 307, 308, 401, 403, 404]

- name: В cron_enable/cron_disable только известные задачи
  ansible.builtin.assert:
    that: (cron_enable + cron_disable) | difference(cron_jobs | map(attribute='name')) | length == 0
    fail_msg: "Нет таких задач в cron_jobs: {{ (cron_enable + cron_disable) | difference(cron_jobs | map(attribute='name')) | join(', ') }}"
    quiet: true

- name: cron
  ansible.builtin.cron:
    user: "{{ app_user }}"
    name: "{{ item.name }}"
    minute: "{{ item.minute | default('*') }}"
    hour: "{{ item.hour | default('*') }}"
    day: "{{ item.day | default('*') }}"
    weekday: "{{ item.weekday | default('*') }}"
    job: "{{ app_dir }}/scripts/{{ item.name }}.sh"
    state: "{{ 'present' if job_on else 'absent' }}"
  vars:
    job_on: "{{ (item.enabled | default(true) or item.name in cron_enable) and item.name not in cron_disable }}"
  loop: "{{ cron_jobs }}"
  loop_control:
    label: "{{ item.name }}{{ '' if job_on else ' (выкл.)' }}"

# Агент локального бэкапа забирает instance/backup_staging/, а его создаёт
# только backup_offsite (cron в 03:20). Без первого запуска агент на
# компьютере председателя до ночи падал бы с «No such file or directory».
# Только пока снимка ещё нет: дальше — cron. Если упадёт restic (Яндекс.Диск),
# staging к этому моменту уже готов — проверяем именно его.
- name: Первый снимок для агента локального бэкапа (backup_offsite)
  ansible.builtin.command: "{{ app_dir }}/scripts/backup_offsite.sh"
  args:
    creates: "{{ app_instance_dir }}/backup_staging/MANIFEST.json"
  become_user: "{{ app_user }}"
  register: first_offsite
  failed_when: false
  when: backup_agent_pubkeys | length > 0

- name: Снимок для агента готов
  ansible.builtin.stat:
    path: "{{ app_instance_dir }}/backup_staging/MANIFEST.json"
  register: staging_manifest
  when: backup_agent_pubkeys | length > 0

- name: backup_staging создан
  ansible.builtin.assert:
    that: staging_manifest.stat.exists
    fail_msg: "backup_offsite не создал backup_staging/MANIFEST.json — см. {{ app_instance_dir }}/logs/backup_offsite.log"
    quiet: true
  when: backup_agent_pubkeys | length > 0

- name: Внешний бэкап при первом запуске не прошёл (staging для агента готов)
  ansible.builtin.debug:
    msg: "backup_offsite завершился с кодом {{ first_offsite.rc }} — см. {{ app_instance_dir }}/logs/backup_offsite.log и backup_offsite_status.json"
  when: backup_agent_pubkeys | length > 0 and first_offsite.rc | default(0) != 0

- name: Итог
  ansible.builtin.debug:
    msg:
      - "Сайт: {{ ('https://' + coop_domain) if https_enabled | bool else ('http://' + (coop_domain or ansible_host)) }}"
      - "Обновления дальше — deployment/deploy-from-git/deploy.sh (конфиг: {{ deploy_conf_path }})"

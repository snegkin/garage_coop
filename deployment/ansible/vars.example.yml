# Копия — в ~/.config/garage-coop/vars.yml (вне git, chmod 600). Все
# остальные настройки и их значения по умолчанию — defaults.yml.

coop_domain: coop.example.ru       # A-запись должна уже смотреть на новый сервер — иначе certbot не выдаст сертификат
# Кириллический домен — в punycode (xn--…), и в certbot_email тоже:
#   python3 -c "print('пример.рф'.encode('idna').decode())"
certbot_email: admin@example.ru

app_branch: master

# Конфиг deploy.sh — в deployment/deploy/, а не в ~/.config/garage-coop:
# deploy_conf_path: "{{ playbook_dir }}/../deploy/deploy.conf"

deploy_ssh_pubkeys:
  - "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

# Ключи — ТЕ ЖЕ, что были на старом сервере. С другим BANK_API_ENCRYPTION_KEY
# сохранённые в БД секреты (банк, почта, Telegram, eWeLink, регистраторы,
# SMS Aero, web-push) не расшифруются — вводить заново. Другой SECRET_KEY
# только разлогинит всех.
#
# Если продовый .env есть на этом компьютере — берём прямо из него, без копий:
prod_env: /home/sne/work/garage_coop/.env
app_secret_key: "{{ lookup('ansible.builtin.ini', 'SECRET_KEY', type='properties', file=prod_env) }}"
app_bank_api_encryption_key: "{{ lookup('ansible.builtin.ini', 'BANK_API_ENCRYPTION_KEY', type='properties', file=prod_env) }}"
# Ключи reCAPTCHA выпускаются на домен: новый домен — добавьте его в
# консоли reCAPTCHA или выпустите новые.
recaptcha_site_key: "{{ lookup('ansible.builtin.ini', 'RECAPTCHA_SITE_KEY', type='properties', file=prod_env, default='') }}"
recaptcha_secret_key: "{{ lookup('ansible.builtin.ini', 'RECAPTCHA_SECRET_KEY', type='properties', file=prod_env, default='') }}"

# Пути в .env — уже под новый сервер (на старом был /home/gmvoshod/...).
app_env_extra:
  SBERBANK_API_CA_BUNDLE: "{{ app_instance_dir }}/bundles/bundle.pem"
  # Внешний бэкап на Яндекс.Диск (scripts/backup_offsite.py,
  # docs/deployment.md, «Внешний бэкап»). Без RESTIC_REPOSITORY cron
  # backup_offsite только готовит каталог для агента председателя.
  # RESTIC_REPOSITORY: rclone:yadisk:coop-backup
  # RESTIC_PASSWORD: "<openssl rand -hex 32 — сохранить и вне сервера>"
  # Вместо Диска — Yandex Object Storage (S3):
  # RESTIC_REPOSITORY: s3:https://storage.yandexcloud.net/<бакет>/coop
  # AWS_ACCESS_KEY_ID: "<статический ключ сервисного аккаунта>"
  # AWS_SECRET_ACCESS_KEY: "<секрет ключа>"
  # AWS_DEFAULT_REGION: ru-central1

# Токен Яндекс.Диска: на компьютере с браузером `rclone authorize "yandex"`,
# вставить JSON из вывода (между ---> и <---) одной строкой в кавычках:
# rclone_yandex_token: '{"access_token":"…","token_type":"OAuth","refresh_token":"…","expiry":"…"}'

# Агенты на ЭТОМ компьютере (компьютер председателя) — ставит сам плейбук,
# deployment/setup.sh --tags local (спросит пароль sudo). Остальные local_backup_*/ezp_* —
# в defaults.yml.
# local_backup_agent: true
# local_backup_repository: /mnt/backup/coop-restic
# local_backup_mount: /mnt/backup
#
# local_ezp_agent: true          # .deb КриптоПро — в agents/ezp/cryptopro/ (см. README там)
# ezp_client_cert: gm-voshod.cer # в agents/ezp/certs/
# ezp_agent_token: "…"
# ezp_id: "…"
# ezp_token: "…"
# ezp_pin: "…"
# ezp_production: false

# Агент бэкапа на ДРУГОМ компьютере (ставится руками, agents/backup/README.md) —
# его открытый ключ. Для агента на этом компьютере не нужно:
# backup_agent_pubkeys:
#   - "ssh-ed25519 AAAA… coop-backup"

# Дополнительные кооперативы на этом же сервере (общий код) — поля и
# пояснения в defaults.yml, README.md «Несколько кооперативов»:
# coop_extra_instances:
#   - name: coop2
#     domain: xn--...xn--p1ai
#     port: 8001
#     secret_key: "<openssl rand -hex 32>"
#     bank_api_encryption_key: "<openssl rand -hex 32>"

# Данные со своего компьютера
restore_db_file: /home/sne/work/garage_coop/instance/coop.db
restore_source_instance_dir: /home/sne/work/garage_coop/instance

# Выключенные по умолчанию cron-задачи (список — cron_jobs в defaults.yml);
# с dvr_snapshot сам ставится ffmpeg:
cron_enable: [dvr_snapshot, poll_messengers, poll_ewelink]

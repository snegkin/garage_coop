<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Сама перезагружается раз в 30 секунд: когда работы закончатся,
     посетитель вернётся на сайт без лишних действий. -->
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>Технические работы</title>
<!-- Страница отдаётся nginx'ом, пока приложение остановлено, поэтому всё
     inline: ни шаблонов, ни Bootstrap, ни шрифтов. Логотип — из /static/,
     который nginx раздаёт с диска сам; не загрузился — просто прячется. -->
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #212529; --muted: #6c757d; --accent: #0d6efd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --card: #212429; --text: #e9ecef; --muted: #9aa0a6; --accent: #6ea8fe; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    width: 100%; max-width: 480px; padding: 32px 24px; text-align: center;
    background: var(--card); border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
  }
  img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 12px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .9rem; margin-top: 16px; }
  .spinner {
    width: 28px; height: 28px; margin: 20px auto 0; border-radius: 50%;
    border: 3px solid var(--muted); border-top-color: var(--accent);
    animation: spin 1s linear infinite; opacity: .7;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main>
  <img src="/static/logo.png" alt="" onerror="this.remove()">
  <h1>Ведутся технические работы</h1>
  <p>Сайт обновляется и скоро снова заработает.</p>
  <p>Обычно это занимает несколько минут.</p>
  <div class="spinner" aria-hidden="true"></div>
  <p class="muted">Страница обновится сама.</p>
</main>
</body>
</html>

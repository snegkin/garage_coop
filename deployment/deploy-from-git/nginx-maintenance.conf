# Заглушка «Ведутся технические работы» — фрагмент для server { } сайта
# (см. INSTALL.md, шаг 6). Пути — как в INSTALL.md, подставьте свои.
#
# Заглушка показывается в двух случаях:
#  1. Есть файл-флаг deployment/deploy-from-git/maintenance.on — его ставит и снимает
#     deployment/deploy-from-git/deploy.sh (вручную: deploy.sh maintenance on|off).
#  2. gunicorn не отвечает (502/504) — пока сервис перезапускается или
#     упал; вместо голой страницы nginx «Bad Gateway».
# Ответ — с исходным кодом (503/502/504) и Retry-After: поисковики не
# проиндексируют заглушку, а агент ЭЗП и прочие клиенты API увидят ошибку,
# а не «успешный» HTML. Свои ошибки приложения (его собственные 5xx)
# проходят как есть — proxy_intercept_errors не включён.
#
# /static/ флаг не проверяет — с него заглушка берёт логотип.

    error_page 502 503 504 @maintenance;

    location @maintenance {
        root /home/coop/garage_coop/deployment/deploy-from-git;
        rewrite ^ /maintenance.html break;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    # В существующий location / — первой строкой, перед proxy_pass:
    location / {
        if (-f /home/coop/garage_coop/deployment/deploy-from-git/maintenance.on) {
            return 503;
        }
        proxy_pass http://127.0.0.1:8000;
        # ... остальные proxy_* как в INSTALL.md
    }
